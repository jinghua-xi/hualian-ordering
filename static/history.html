<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>历史订单 · 华联服装辅料福州分公司</title>
  <link rel="stylesheet" href="../styles.css?v=order-workflow-2">
  <script type="module" src="../sales.js?v=record-delete-1"></script>
</head>
<body data-order-history="customer">
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="../" aria-label="华联服装辅料福州分公司首页">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span><strong>华联服装辅料</strong><small>福州分公司 · 在线接单</small></span>
      </a>
      <a class="quiet-link" href="../"><span aria-hidden="true">←</span> 返回接单页</a>
    </div>
  </header>
  <main class="shell sales-page">
    <section class="hero sales-hero">
      <div class="hero-copy">
        <div class="eyebrow">我的账户</div>
        <h1>历史订单</h1>
        <p>查看自己的订单，打开「详情」后可选择「再来一单」，复制商品和数量并重新填写交期。</p>
      </div>
    </section>
    <section class="panel sales-panel" aria-labelledby="sales-title">
      <div class="panel-head">
        <div>
          <h2 id="sales-title">我的订单</h2>
          <p id="sales-count" aria-live="polite">正在加载订单</p>
        </div>
        <div class="sales-actions">
          <label class="sr-only" for="order-search">搜索订单号或客户名称</label>
          <input id="order-search" type="search" maxlength="80" placeholder="搜索订单号或客户名称">
          <button id="refresh-orders" class="button secondary" type="button">刷新订单</button>
        </div>
      </div>
      <p id="sales-error" class="inline-error" role="alert" hidden></p>
      <div id="orders-wrap" hidden>
        <div id="orders" class="record-list"></div>
      </div>
      <p id="orders-empty" class="empty-orders" hidden>当前账号还没有历史订单。提交试单后，可以在这里查看。</p>
    </section>
    <footer class="footer">
      <span>华联服装辅料 · 福州分公司</span>
      <span>公开商品目录 · 订单仅用于试单</span>
    </footer>
  </main>
</body>
</html>
